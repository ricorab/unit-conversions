<title>Unit Conversion Guide (US customary)</title>

  @media (max-width: 640px) {
    .doors { grid-template-columns: 1fr; gap: 10px; } .door { min-height: 0; flex-direction: row; padding: 14px; gap: 14px; justify-content: flex-start; text-align: left; } .door .em { font-size: 2.4rem; }
    .layout { grid-template-columns: 1fr; gap: 8px; }
    .ladder { padding: 6px; } .ladder-title { display: none; }
    .lad { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; }

<body>

<!-- ================= START: three doors ================= -->
<section id="startScreen">
  <h1>Unit Conversion Guide</h1>
  <p class="subtitle">✏️ Get your pencil and paper ready. Pick what you're measuring.</p>
  <div class="doors">
    <button class="door" data-fam="capacity" onclick="openFamily('capacity')"><span class="em">🥛</span><span><span class="dn">Capacity</span><br><small>fluid ounces, cups, pints,<br>quarts, gallons</small></span></button>
    <button class="door" data-fam="weight" onclick="openFamily('weight')"><span class="em">⚖️</span><span><span class="dn">Weight</span><br><small>ounces, pounds, tons</small></span></button>
    <button class="door" data-fam="length" onclick="openFamily('length')"><span class="em">📏</span><span><span class="dn">Length</span><br><small>inches, feet, yards, miles</small></span></button>
  </div>
</section>

<!-- ================= PICK UNITS ================= -->
<section id="pickScreen" class="hidden">
  <div class="topbar">
    <button class="link" onclick="showStart()">← Menu</button>
    <div class="ptitle" id="pickTitle"></div>
    <span class="stats"></span>
  </div>
  <div class="pick-title">1. Start with…</div>
  <div class="units" id="fromUnits"></div>
  <div id="toWrap" class="hidden">
    <div class="pick-title">2. Change to…</div>
    <div class="units" id="toUnits"></div>
  </div>
  <div class="start-wrap"><button class="big" id="goBtn" onclick="startSingle()" disabled>Start ▶</button></div>
  <div id="mixedCard" class="mixed-card"></div>
</section>

<!-- ================= MAIN ================= -->
<section id="mainScreen" class="hidden">
  <div class="topbar">
    <button class="link" id="unitsBtn" onclick="showPick()">← Units</button>
    <div class="ptitle" id="ptitle"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="layout">
    <aside class="ladder" id="ladder" aria-label="Reference table"></aside>
    <div>
      <div class="qcard" id="qcard"></div>
      <div id="step" class="step-box" aria-live="polite"></div>
      <div id="final" class="final-answer hidden"></div>
      <div id="solution" class="solution hidden"></div>
      <div class="controls" id="controls">
        <button id="backBtn" class="secondary" onclick="goBack()">← Back</button>
        <button id="hintBtn" onclick="tapHint()">💡 Hint</button>
        <button id="solBtn" class="link" onclick="showSolution()">Show me the whole solution</button>
      </div>
      <div class="progress-wrap"><div class="bar"><div id="bar"></div></div><div id="progress" class="progress"></div></div>
    </div>
  </div>
</section>

<!-- ============ PURE LOGIC (tested by test.js; no DOM in here) ============ -->
<script id="logic">
/* ===================== UNITS (US customary) ===================== */
// size = how many of the family's smallest unit make one of this unit. Ladder goes smallest → biggest.
const FAMILIES = {
  capacity: { name: "Capacity", emoji: "🥛", units: [
    { id: "floz", one: "fluid ounce", many: "fluid ounces", short: "fl oz", size: 1 },
    { id: "cup", one: "cup", many: "cups", short: "c", size: 8 },
    { id: "pint", one: "pint", many: "pints", short: "pt", size: 16 },
    { id: "quart", one: "quart", many: "quarts", short: "qt", size: 32 },
    { id: "gallon", one: "gallon", many: "gallons", short: "gal", size: 128 }],
    extra: [["gallon", "floz"]] },
  weight: { name: "Weight", emoji: "⚖️", units: [
    { id: "oz", one: "ounce", many: "ounces", short: "oz", size: 1 },
    { id: "lb", one: "pound", many: "pounds", short: "lb", size: 16 },
    { id: "ton", one: "ton", many: "tons", short: "T", size: 32000 }],
    extra: [] },
  length: { name: "Length", emoji: "📏", units: [
    { id: "in", one: "inch", many: "inches", short: "in", size: 1 },
    { id: "ft", one: "foot", many: "feet", short: "ft", size: 12 },
    { id: "yd", one: "yard", many: "yards", short: "yd", size: 36 },
    { id: "mi", one: "mile", many: "miles", short: "mi", size: 63360 }],
    extra: [["mi", "ft"]] }
};
const unitOf = (fam, id) => FAMILIES[fam].units.find(u => u.id === id);
const rankOf = (fam, id) => FAMILIES[fam].units.findIndex(u => u.id === id);
const fmt = n => String(n).length > 3 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : String(n);
const name = (u, n) => (n === 1 ? u.one : u.many);
const NUMWORD = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
const cap = s => s[0].toUpperCase() + s.slice(1);
// how many `small` units in one `big` unit
function factor(fam, big, small) { return unitOf(fam, big).size / unitOf(fam, small).size; }
// the rungs between two units (big → small), e.g. gallon→quart (4), quart→pint (2)…

  if (P.revealed) { S.streak = 0; S.run[fam] = 0; return; }
  S.solved++; S.streak++;
  if (P.wrongs === 0) { S.run[fam]++; if (S.run[fam] >= UNLOCK_AFTER && !S.mixed[fam]) { S.mixed[fam] = true; P.unlockedNow = true; } } else S.run[fam] = 0;
  if (P.hintTaps === 0 && P.wrongs === 0) { S.clean[fam]++; if (S.clean[fam] >= FADE_AFTER && S.auto[fam]) { S.auto[fam] = false; P.fadedNow = true; } }
  else S.clean[fam] = 0;
}
function pickDir(d) {
  const s = P.steps[idx]; if (s.type !== "dir" || rightPick) return;
  const r = checkDir(s, d);
  if (r.ok) { rightPick = d; delete coach[idx]; render(); setTimeout(() => { if (rightPick === d && P.steps[idx] === s) advance(); }, 500); return; }
  (picked[idx] || (picked[idx] = [])).push(d); coach[idx] = r.msg; P.wrongs++; render();
}
function submitAnswer() {
  const s = P.steps[idx]; if (s.type !== "factor" && s.type !== "calc") return;
  const el = document.getElementById("answerInput"), raw = el.value;
  const r = checkNumber(s, raw);
  if (r.ok) { delete coach[idx]; advance(); return; }
  coach[idx] = r.msg;
  if (!r.empty && parseWhole(raw) !== null) {
    (tries[idx] || (tries[idx] = [])).push(raw.trim()); P.wrongs++;
    if (S.auto[fam] && (hintsShown[idx] || 0) < hintsFor(s).length) hintsShown[idx] = (hintsShown[idx] || 0) + 1;
  }
  render();
  const e2 = document.getElementById("answerInput"); if (e2) { e2.value = ""; e2.focus(); }
}
function tapHint() {
  const s = P.steps[idx], hs = hintsFor(s);
  if (!hs.length || (hintsShown[idx] || 0) >= hs.length) return;
  hintsShown[idx] = (hintsShown[idx] || 0) + 1; P.hintTaps++; S.clean[fam] = 0; S.auto[fam] = true; render();
}
function gateTapped(cb) { if (!cb.checked || gateLock) return; gateLock = true; setTimeout(() => { gateLock = false; advance(); }, 300); }
function showSolution() {
  if (!P) return;
  P.revealed = true; S.streak = 0; S.clean[fam] = 0; S.run[fam] = 0;
  const rows = solutionRows(P);
  const el = document.getElementById("solution");
  el.innerHTML = `<h3>The whole solution</h3>${rows.map((r, i) => `<div class="sol-row"><span class="${i === rows.length - 1 ? "expr" : ""}" style="${i === rows.length - 1 ? "font-size:1.3rem;font-weight:bold" : ""}">${r}</span></div>`).join("")}
    <div class="sol-note">Seeing the solution is OK when you're stuck. This one won't count as solved. Next time, try a 💡 hint first!</div>
    <div class="controls"><button class="secondary" id="solClose" onclick="hideSolution()">Keep working on this one</button><button id="solNext" onclick="nextProblem()">Next problem →</button></div>`;
  el.classList.remove("hidden"); render();
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function hideSolution() { document.getElementById("solution").classList.add("hidden"); render(); }

/* ---------- rendering ---------- */
function curDir() { const d = P.steps[0]; return idx > 0 ? d.answer : rightPick; }
function renderLadder() {
  const F = FAMILIES[fam], us = [...F.units].reverse(), s0 = P.steps[0];
  const dir = curDir();
  const lo = Math.min(rankOf(fam, s0.from), rankOf(fam, s0.to)), hi = Math.max(rankOf(fam, s0.from), rankOf(fam, s0.to));
  const fromIds = P.spec.kind === "mixed" ? P.spec.parts.map(p => p.unit) : [s0.from];
  let h = `<div class="ladder-title">📋 ${F.name} ladder</div><div class="lad">`;
  us.forEach((u, i) => {
    const isFrom = fromIds.includes(u.id), isTo = u.id === P.spec.to;
    const cls = isTo && dir ? "to" : isFrom ? "from" : isTo ? "to" : "";
    h += `<div class="lu ${cls}" data-u="${u.id}">${isFrom && isTo ? `<span class="tagu">same</span>` : isFrom ? `<span class="tagu">from</span>` : isTo ? `<span class="tagu">to</span>` : ""}${u.many} <small>(${u.short})</small></div>`;
    const nx = us[i + 1];
    if (nx) {
      const r = rankOf(fam, u.id), on = dir && dir !== "same" && r <= hi && r - 1 >= lo;
      const arrow = on ? (dir === "down" ? "⬇" : "⬆") : "↕";
      h += `<div class="rung ${on ? "path" : ""}"><span class="l">${arrow} 1 ${u.short} = ${fmt(u.size / nx.size)} ${nx.short}</span><span class="s">${on ? arrow : ""}${fmt(u.size / nx.size)}</span></div>`;
    }
  });
  h += `</div>`;
  if (F.extra.length) h += `<div class="lad-extra">${F.extra.map(([a, b]) => `1 ${unitOf(fam, a).short} = ${fmt(factor(fam, a, b))} ${unitOf(fam, b).short}`).join("<br>")}</div>`;
  const el = document.getElementById("ladder"); el.innerHTML = h; el.classList.toggle("go", !!dir);
}
function render() {
  const s = P.steps[idx];
  renderLadder();
  const dir = curDir();
  document.getElementById("qcard").innerHTML = `<div class="question" id="question">${P.question}</div>` +
    (dir ? `<div class="dirbadge ${dir}" id="dirBadge">${dir === "down" ? "⬇ Down the ladder to a smaller unit → multiply ×" : dir === "up" ? "⬆ Up the ladder to a bigger unit → divide ÷" : "= Same unit → no change"}</div>` : `<div class="dirbadge unknown" id="dirBadge">Which way on the ladder? ⬆ or ⬇</div>`);
  const box = document.getElementById("step");
  let html = "";
  const hs = hintsFor(s), shown = hintsShown[idx] || 0;
  const hintBlock = shown ? `<div class="hints">${hs.slice(0, shown).map(h => `<div class="hintline"><span class="tag">${h.tag}</span>${h.text}</div>`).join("")}</div>` : "";
  const coachBlock = coach[idx] ? `<div id="feedback" class="feedback coach">${coach[idx]}</div>` : `<div id="feedback" class="feedback"></div>`;
  const input = (label, unit) => `<input id="answerInput" inputmode="numeric" autocomplete="off" aria-label="${label}" onkeydown="if(event.key==='Enter') submitAnswer()">${unit ? `<span class="unitlabel">${unit}</span>` : ""}<button class="check" onclick="submitAnswer()">Check</button>`;
  const triesBlock = (tries[idx] || []).length ? `<div class="tries">${tries[idx].map(v => `<span class="try">${v.replace(/</g, "&lt;")} ✗</span>`).join("")}</div>` : "";
  if (s.type === "dir") {
    const F = unitOf(fam, s.from), T = unitOf(fam, s.to), wrong = new Set(picked[idx] || []);
    html += `<div class="ask">Which way on the ladder?</div><div class="sub">From <b>${P.spec.kind === "mixed" ? "bigger units" : F.many}</b> to <b>${T.many}</b></div>`;
    html += `<div class="dirs">${["down", "up", "same"].map(d => `<button class="choice ${wrong.has(d) ? "wrong" : ""} ${rightPick === d ? "right" : ""}" data-dir="${d}" ${wrong.has(d) ? "disabled" : ""} onclick="pickDir('${d}')"><span class="sym">${wrong.has(d) ? "✗" : rightPick === d ? "✓" : { down: "⬇", up: "⬆", same: "=" }[d]}</span>${DIRNAME[d].slice(2)}</button>`).join("")}</div>`;
    html += coachBlock + hintBlock;
  } else if (s.type === "factor") {
    const B = unitOf(fam, s.big), Sm = unitOf(fam, s.small);
    html += s.up ? `<div class="ask">How many <b>${Sm.many}</b> make <b>1 ${B.one}</b>?</div>` : `<div class="ask">How many <b>${Sm.many}</b> are in <b>1 ${B.one}</b>?</div>`;
    html += `<div class="sub">Use the ladder.</div><div class="input-area"><span class="work">1 ${B.short} =</span>${input(`${Sm.many} in 1 ${B.one}`, Sm.short)}</div>`;
    html += triesBlock + coachBlock + hintBlock;
  } else if (s.type === "calc") {
    const Sm = unitOf(fam, s.small);
    let ask, work;
    if (s.op === "×") { ask = P.spec.kind === "mixed" ? `Change the ${fmt(s.a)} ${name(unitOf(fam, s.big), s.a)} to ${Sm.many}: multiply` : "Now multiply"; work = `${fmt(s.a)} × ${fmt(s.b)} =`; }
    else if (s.op === "÷") { ask = "Now divide"; work = `${fmt(s.a)} ÷ ${fmt(s.b)} =`; }
    else if (s.op === "half") { ask = "Now take half"; work = `${fmt(s.a)} ÷ 2 =`; }
    else if (s.op === "same") { ask = "Same unit: what's the number?"; work = `${P.given} =`; }
    else { ask = `Add the parts (both in ${Sm.many} now)`; work = `${fmt(s.a)} + ${fmt(s.b)} =`; }
    html += `<div class="ask">${ask}</div><div class="input-area"><span class="work">${work}</span>${input("Your answer", s.op === "×" || s.op === "+" || s.op === "half" || s.op === "same" ? Sm.short : unitOf(fam, s.big).short)}</div>`;
    html += triesBlock + coachBlock + hintBlock;
  } else if (s.type === "gate") {
    html += `<div class="did">✓ Correct! ${P.given} = ${fmt(P.answer)} ${name(unitOf(fam, P.spec.to), P.answer)}</div>`;
    html += `<div class="gate-head">✏️ Write it on your paper</div><div class="gate-text">Write this on your paper:</div><div class="gate-line" id="gateLine">${P.line}</div>`;
    html += `<label class="gate-check"><input type="checkbox" id="gateBox" onchange="gateTapped(this)" onkeydown="if(event.key==='Enter'){this.checked=true;gateTapped(this)}"> I wrote it</label>`;
  }
  box.innerHTML = html;
  box.classList.toggle("hidden", s.type === "done");
  box.classList.toggle("gate", s.type === "gate");

  const fin = document.getElementById("final");
  if (s.type === "done") {
    fin.classList.remove("hidden");
    const head = P.revealed ? "Finished! This one doesn't count because you saw the solution. Try the next one on your own 💪" : "🎉 You did it! Does your paper match?";
    fin.innerHTML = `<div style="font-size:1rem;font-weight:normal;margin-bottom:6px">${head}</div><div style="font-size:1.5rem">${P.given} = ${fmt(P.answer)} ${name(unitOf(fam, P.spec.to), P.answer)}</div>`
      + (P.unlockedNow ? `<div class="unlock">🔓 You got ${UNLOCK_AFTER} in a row! <b>Mixed units</b> are unlocked for ${FAMILIES[fam].name.toLowerCase()}.</div>` : "")
      + (P.fadedNow ? `<div class="faded-note">You're on a roll! Hints will stay out of the way now. Tap 💡 Hint any time you want one.</div>` : "")
      + `<div class="controls" style="margin-top:14px"><button id="nextBtn" class="big" onclick="nextProblem()">Next problem →</button>${P.unlockedNow ? `<button id="tryMixedBtn" class="big" style="background:#28a745" onclick="startMixed()">Try mixed units</button>` : ""}</div>`
      + `<div><button class="link" id="changeBtn" onclick="showPick()">Change units</button></div>`;
  } else fin.classList.add("hidden");

  document.getElementById("backBtn").disabled = idx === 0;
  const hb = document.getElementById("hintBtn"), hintable = ["dir", "factor", "calc"].includes(s.type);
  hb.className = (hintable ? "" : "hidden ") + (S.auto[fam] ? "auto" : "faded");
  hb.disabled = !hs.length || shown >= hs.length;
  hb.textContent = !hs.length || shown < hs.length ? (shown ? `💡 Another hint (${shown}/${hs.length})` : "💡 Hint") : "💡 No more hints";
  const solOpen = !document.getElementById("solution").classList.contains("hidden");
  document.getElementById("solBtn").classList.toggle("hidden", s.type === "done" || solOpen);
  document.getElementById("stats").innerHTML = `<span title="Problems solved">⭐ <b id="solvedN">${S.solved}</b></span> &nbsp;<span title="In a row">🔥 <b id="streakN">${S.streak}</b></span>`;
  const total = P.steps.length - 1;
  document.getElementById("bar").style.width = Math.round(100 * idx / total) + "%";
  document.getElementById("progress").textContent = s.type === "done" ? `Solved: ${S.solved} · In a row: ${S.streak}` : `Step ${idx + 1} of ${total}`;
  const focusEl = document.getElementById("answerInput") || document.getElementById("gateBox") || document.querySelector(".dirs .choice:not(:disabled)") || document.getElementById("nextBtn");
  if (focusEl && !solOpen) focusEl.focus({ preventScroll: true });
  const target = s.type === "done" ? fin : document.getElementById("controls");
  if (!solOpen && target.getBoundingClientRect().bottom > window.innerHeight) target.scrollIntoView({ block: "end", behavior: "smooth" });
}
</script>
</body>
</html>
